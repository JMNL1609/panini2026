<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>FIFA World Cup 2026 · Panini · Álbum Interactivo</title>
  
  <meta name="theme-color" content="#030614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panini 2026">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --touch-min: 48px;
      --gold: #F5C542;
      --gold-dark: #C6921E;
      --gold-glow: rgba(245, 197, 66, 0.35);
      --red: #E03A3E;
      --blue-deep: #0A1A3A;
      --bg-main: #030614;
      --card-bg: #0B1429;
      --border-glow: rgba(245, 197, 66, 0.25);
      --text-light: #F0F3FA;
      --text-muted: #8A9DC0;
      --owned-border: #2AD18A;
      --orange-border: #FF8C00;
    }

    body {
      background: var(--bg-main);
      font-family: 'Inter', sans-serif;
      color: var(--text-light);
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, #04112e 0%, #071a3a 100%);
      border-bottom: 3px solid var(--gold);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
    }

    .trophy-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 12px var(--gold-glow));
      animation: floatTrophy 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes floatTrophy {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .main-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(1.8rem, 7vw, 3.5rem);
      letter-spacing: 4px;
      background: linear-gradient(135deg, #FFE6A3, #E8B82E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: var(--space-xs) 0;
    }

    .subhead {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .owner-badge {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: var(--space-xs) var(--space-md);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: var(--space-sm);
      border: 1px solid rgba(245,197,66,0.4);
      font-size: 0.75rem;
    }

    .stats-panel {
      background: rgba(8, 18, 38, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glow);
      padding: var(--space-md);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-sm);
    }

    .stat-card {
      background: rgba(255,255,255,0.02);
      padding: var(--space-sm) var(--space-md);
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(245,197,66,0.15);
    }

    .stat-number {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.8rem;
      line-height: 1;
      font-weight: 600;
    }

    .stat-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .gold-text { color: var(--gold); }
    .green-text { color: #2AD18A; }
    .red-text { color: #FF6B6B; }
    .orange-text { color: #FF8C00; }

    .progress-container {
      grid-column: 1 / -1;
    }

    .progress-bar-bg {
      background: #1F2A44;
      height: 10px;
      border-radius: 12px;
      overflow: hidden;
    }

    .progress-fill-main {
      background: linear-gradient(90deg, var(--gold), #2AD18A);
      width: 0%;
      height: 100%;
      border-radius: 12px;
      transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .search-bar {
      padding: var(--space-sm) var(--space-md);
      background: rgba(6, 14, 28, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(245,197,66,0.2);
    }

    .search-field {
      background: #0A1125;
      border: 1px solid var(--border-glow);
      border-radius: 48px;
      padding: var(--space-sm) var(--space-md);
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }

    .search-field input {
      background: transparent;
      border: none;
      flex: 1;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    .action-bar {
      padding: var(--space-sm) var(--space-md);
      display: flex;
      gap: var(--space-sm);
      background: rgba(6, 14, 28, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(245,197,66,0.2);
      flex-wrap: wrap;
    }

    .pdf-bar {
      padding: var(--space-sm) var(--space-md);
      background: rgba(6, 14, 28, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(245,197,66,0.2);
      display: none;
    }
    
    .pdf-bar.visible {
      display: block;
    }

    .btn {
      background: rgba(20, 35, 65, 0.9);
      border: 1px solid rgba(245,197,66,0.4);
      padding: 0 var(--space-sm);
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #E0E9FF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: var(--touch-min);
      flex: 1;
      text-align: center;
    }

    .btn-pdf {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      color: #ff6b6b;
      width: 100%;
    }

    .btn:active { transform: scale(0.96); }
    .btn.active-view {
      background: rgba(245,197,66,0.25);
      border-color: var(--gold);
      color: var(--gold);
    }

    .flags-grid {
      padding: var(--space-md);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-xs);
    }

    .flag-btn-grid {
      background: rgba(20, 30, 55, 0.8);
      border: 1px solid rgba(245,197,66,0.3);
      border-radius: 30px;
      padding: var(--space-xs);
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      min-height: 44px;
      color: var(--text-light);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-md);
      padding: var(--space-md);
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid rgba(245,197,66,0.2);
      overflow: hidden;
    }

    .team-card.complete {
      border-color: #2AD18A;
      box-shadow: 0 0 8px rgba(42,209,138,0.3);
    }

    .team-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(95deg, rgba(245,197,66,0.08), transparent);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      min-height: var(--touch-min);
    }

    .team-flag {
      font-size: 1.5rem;
      filter: drop-shadow(0 2px 4px black);
    }

    .team-code {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.2rem;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .team-name {
      flex: 1;
      font-weight: 600;
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .team-stats {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
    }

    .team-progress-bar {
      width: 40px;
      height: 4px;
      background: #1F2A44;
      border-radius: 4px;
      overflow: hidden;
    }

    .team-progress-fill {
      height: 100%;
      background: var(--gold);
      width: 0%;
    }

    .complete-tag {
      background: #1c5438;
      padding: 0 6px;
      border-radius: 20px;
      font-size: 0.5rem;
      color: #A2F0C0;
      display: none;
    }

    .team-card.complete .complete-tag { display: inline-block; }

    .sticker-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      padding: var(--space-sm);
      position: relative;
      justify-content: flex-start;
    }

    .sticker {
      width: calc(20% - 4px);
      min-width: 48px;
      height: 48px;
      background: #0F172F;
      border-radius: 8px;
      border: 1px solid #2A3A60;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      color: #9AACD0;
      cursor: pointer;
      position: relative;
    }

    .sticker.owned {
      background: linear-gradient(145deg, #0D3B20, #072613);
      border-color: #2AD18A;
      color: #C6FFDD;
    }

    .sticker.duplicate {
      background: linear-gradient(145deg, #3B1A0A, #2A0E04);
      border-color: #FF8C00;
      color: #FFD700;
    }

    .duplicate-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #FF8C00;
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 900;
      border: 2px solid #030614;
    }

    .team-card.hidden {
      display: none;
    }

    .scroll-top-btn {
      position: absolute;
      bottom: var(--space-sm);
      right: var(--space-md);
      background: rgba(20, 35, 65, 0.9);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: var(--space-xs) var(--space-md);
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--gold);
      cursor: pointer;
      min-height: 36px;
    }

    .toast-notify {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #101a32e6;
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 60px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 1000;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }

    .toast-notify.show {
      transform: translateX(-50%) translateY(0px);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-dialog {
      background: linear-gradient(145deg, #0F1A3A, #081028);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: var(--space-lg);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .modal-dialog p {
      font-size: 0.85rem;
      margin-bottom: var(--space-lg);
    }

    .modal-buttons {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
    }

    .modal-buttons button {
      padding: var(--space-sm) var(--space-lg);
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      min-height: var(--touch-min);
    }

    .btn-undo {
      background: rgba(245,197,66,0.2);
      border: 2px solid var(--gold);
      color: var(--gold);
    }

    .btn-close {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
    }

    .qr-container {
      padding: var(--space-xl);
      text-align: center;
    }

    .qr-box {
      background: white;
      padding: var(--space-lg);
      border-radius: 20px;
      display: inline-block;
      margin: var(--space-lg) 0;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    @media (min-width: 600px) {
      .stats-panel {
        grid-template-columns: repeat(5, 1fr);
      }
      .teams-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .teams-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .teams-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
<div class="app-container">
<div id="mainPage" class="page active">
  <div class="hero" id="topPage">
    <div class="trophy-icon">🏆✨⚽</div>
    <h1 class="main-title">FIFA WORLD CUP 2026</h1>
    <div class="subhead">PANINI DIGITAL ALBUM · EDITION GOLD</div>
    <div class="owner-badge">
      <span>👤 SEBASTIAN NAVARRO</span>
      <span>🇲🇽🇺🇸🇨🇦</span>
    </div>
  </div>

  <div class="stats-panel">
    <div class="stat-card"><div class="stat-number green-text" id="stat-owned">0</div><div class="stat-label">TENGO</div></div>
    <div class="stat-card"><div class="stat-number red-text" id="stat-missing">0</div><div class="stat-label">FALTAN</div></div>
    <div class="stat-card"><div class="stat-number gold-text" id="stat-total">0</div><div class="stat-label">TOTAL</div></div>
    <div class="stat-card"><div class="stat-number gold-text" id="stat-percent">0%</div><div class="stat-label">COMPLETO</div></div>
    <div class="stat-card"><div class="stat-number orange-text" id="stat-duplicates">0</div><div class="stat-label">REPETIDAS</div></div>
    <div class="progress-container">
      <div class="progress-bar-bg"><div class="progress-fill-main" id="global-progress-fill"></div></div>
    </div>
  </div>

  <div class="search-bar">
    <div class="search-field">
      <span>🔍</span>
      <input type="text" id="searchTeam" placeholder="Buscar equipo o código (ej: MEX, Brasil)" autocomplete="off">
    </div>
  </div>

  <div class="action-bar">
    <button class="btn active-view" id="albumBtn">📒 Álbum</button>
    <button class="btn" id="missingBtn">🔍 Me faltan</button>
    <button class="btn" id="duplicatesBtn">🔄 Repetidas</button>
    <button class="btn" id="qrBtn">📱 QR</button>
  </div>

  <div class="pdf-bar" id="pdfBar">
    <button class="btn btn-pdf" id="pdfBtn">📄 Exportar PDF</button>
  </div>

  <div class="flags-grid" id="flagsGridContainer"></div>
  <div class="teams-grid" id="teamsContainer"></div>
  <div class="world-cup-footer">
    ⚽ 48 EQUIPOS · 1015 CROMOS OFICIALES ⚽
  </div>
</div>

<div id="qrPage" class="page">
  <div class="hero">
    <div class="trophy-icon">📱🔲</div>
    <h1 class="main-title">COMPARTIR REPETIDAS</h1>
    <div class="subhead">ESCANEA EL CÓDIGO QR</div>
  </div>
  <div class="qr-container">
    <div class="qr-box" id="qrcode"></div>
    <div class="qr-data" id="qrDataText"></div>
    <button class="btn back-btn" id="backToAlbumBtn">← Volver al Álbum</button>
  </div>
</div>

<div id="toastMsg" class="toast-notify"></div>
</div>

<script>
  // ==================== CONFIGURACIÓN ====================
  const SECTIONS = [
    { code:'FWC', name:'FIFA World Cup', flag:'🏆', n:20, useEmoji: true },
    { code:'MEX', name:'México', flag:'🇲🇽', n:20, useEmoji: false },
    { code:'RSA', name:'Sudáfrica', flag:'🇿🇦', n:20, useEmoji: false },
    { code:'KOR', name:'Corea del Sur', flag:'🇰🇷', n:20, useEmoji: false },
    { code:'CZE', name:'República Checa', flag:'🇨🇿', n:20, useEmoji: false },
    { code:'CAN', name:'Canadá', flag:'🇨🇦', n:20, useEmoji: false },
    { code:'BIH', name:'Bosnia y Herz.', flag:'🇧🇦', n:20, useEmoji: false },
    { code:'QAT', name:'Qatar', flag:'🇶🇦', n:20, useEmoji: false },
    { code:'SUI', name:'Suiza', flag:'🇨🇭', n:20, useEmoji: false },
    { code:'BRA', name:'Brasil', flag:'🇧🇷', n:20, useEmoji: false },
    { code:'MAR', name:'Marruecos', flag:'🇲🇦', n:20, useEmoji: false },
    { code:'HAI', name:'Haití', flag:'🇭🇹', n:20, useEmoji: false },
    { code:'SCO', name:'Escocia', flag:'🏴󠁧󠁢󠁳󠁣󠁴󠁿', n:20, useEmoji: false },
    { code:'USA', name:'Estados Unidos', flag:'🇺🇸', n:20, useEmoji: false },
    { code:'PAR', name:'Paraguay', flag:'🇵🇾', n:20, useEmoji: false },
    { code:'AUS', name:'Australia', flag:'🇦🇺', n:20, useEmoji: false },
    { code:'TUR', name:'Türkiye', flag:'🇹🇷', n:20, useEmoji: false },
    { code:'GER', name:'Alemania', flag:'🇩🇪', n:20, useEmoji: false },
    { code:'CUW', name:'Curaçao', flag:'🇨🇼', n:20, useEmoji: false },
    { code:'CIV', name:'Costa de Marfil', flag:'🇨🇮', n:20, useEmoji: false },
    { code:'ECU', name:'Ecuador', flag:'🇪🇨', n:20, useEmoji: false },
    { code:'NED', name:'Países Bajos', flag:'🇳🇱', n:20, useEmoji: false },
    { code:'JPN', name:'Japón', flag:'🇯🇵', n:20, useEmoji: false },
    { code:'SWE', name:'Suecia', flag:'🇸🇪', n:20, useEmoji: false },
    { code:'TUN', name:'Túnez', flag:'🇹🇳', n:20, useEmoji: false },
    { code:'BEL', name:'Bélgica', flag:'🇧🇪', n:20, useEmoji: false },
    { code:'EGY', name:'Egipto', flag:'🇪🇬', n:20, useEmoji: false },
    { code:'IRN', name:'Irán', flag:'🇮🇷', n:20, useEmoji: false },
    { code:'NZL', name:'Nueva Zelanda', flag:'🇳🇿', n:20, useEmoji: false },
    { code:'ESP', name:'España', flag:'🇪🇸', n:20, useEmoji: false },
    { code:'CPV', name:'Cabo Verde', flag:'🇨🇻', n:20, useEmoji: false },
    { code:'KSA', name:'Arabia Saudita', flag:'🇸🇦', n:20, useEmoji: false },
    { code:'URU', name:'Uruguay', flag:'🇺🇾', n:20, useEmoji: false },
    { code:'FRA', name:'Francia', flag:'🇫🇷', n:20, useEmoji: false },
    { code:'SEN', name:'Senegal', flag:'🇸🇳', n:20, useEmoji: false },
    { code:'IRQ', name:'Irak', flag:'🇮🇶', n:20, useEmoji: false },
    { code:'NOR', name:'Noruega', flag:'🇳🇴', n:20, useEmoji: false },
    { code:'ARG', name:'Argentina', flag:'🇦🇷', n:20, useEmoji: false },
    { code:'ALG', name:'Argelia', flag:'🇩🇿', n:20, useEmoji: false },
    { code:'AUT', name:'Austria', flag:'🇦🇹', n:20, useEmoji: false },
    { code:'JOR', name:'Jordania', flag:'🇯🇴', n:20, useEmoji: false },
    { code:'POR', name:'Portugal', flag:'🇵🇹', n:20, useEmoji: false },
    { code:'COD', name:'Rep. Dem. Congo', flag:'🇨🇩', n:20, useEmoji: false },
    { code:'UZB', name:'Uzbekistán', flag:'🇺🇿', n:20, useEmoji: false },
    { code:'COL', name:'Colombia', flag:'🇨🇴', n:20, useEmoji: false },
    { code:'ENG', name:'Inglaterra', flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', n:20, useEmoji: false },
    { code:'CRO', name:'Croacia', flag:'🇭🇷', n:20, useEmoji: false },
    { code:'GHA', name:'Ghana', flag:'🇬🇭', n:20, useEmoji: false },
    { code:'PAN', name:'Panamá', flag:'🇵🇦', n:20, useEmoji: false },
    { code:'CC',  name:'Tarjetas Especiales', flag:'⭐', n:14, useEmoji: true },
  ];

  const TOTAL_STICKERS = SECTIONS.reduce((acc, s) => acc + s.n, 0) + 1;
  let ownedState = {};
  let currentView = 'album';
  let lastTapTime = 0;
  const DOUBLE_TAP_DELAY = 300;
  let tapTimer = null;
  let currentSearchTerm = '';

  if (!ownedState.hasOwnProperty('FWC00')) {
    ownedState['FWC00'] = 0;
  }

  try {
    const saved = localStorage.getItem('panini2026_app');
    if(saved) {
      const parsed = JSON.parse(saved);
      ownedState = parsed;
      if (!ownedState.hasOwnProperty('FWC00')) ownedState['FWC00'] = 0;
    }
  } catch(e) {}

  function persist() {
    localStorage.setItem('panini2026_app', JSON.stringify(ownedState));
  }

  function getOwnedCount() {
    let count = 0;
    for (const qty of Object.values(ownedState)) {
      if (qty >= 1) count++;
    }
    return count;
  }

  function getMissingCount() {
    return TOTAL_STICKERS - getOwnedCount();
  }

  function getDuplicateCount() {
    let totalDuplicates = 0;
    for (const qty of Object.values(ownedState)) {
      if (qty >= 2) {
        totalDuplicates += (qty - 1);
      }
    }
    return totalDuplicates;
  }

  function getMissingList() {
    const missing = [];
    SECTIONS.forEach(sec => {
      for(let i=1; i<=sec.n; i++) {
        const sid = `${sec.code}${i}`;
        if (!ownedState[sid] || ownedState[sid] === 0) missing.push(sid);
      }
    });
    if (!ownedState['FWC00'] || ownedState['FWC00'] === 0) {
      missing.push('FWC00');
    }
    return missing;
  }

  function getDuplicatesList() {
    const duplicates = [];
    for (const [sid, qty] of Object.entries(ownedState)) {
      if (qty >= 2) {
        for (let i = 0; i < (qty - 1); i++) {
          duplicates.push(sid);
        }
      }
    }
    return duplicates;
  }

  // ==================== FUNCIÓN PDF CORREGIDA ====================
  async function generatePDF() {
    let list = [];
    let title = '';
    
    if (currentView === 'missing') {
      list = getMissingList();
      title = 'CROMOS FALTANTES';
    } else if (currentView === 'duplicates') {
      list = getDuplicatesList();
      title = 'CROMOS REPETIDOS';
    } else {
      showToast('Cambia a vista "Me faltan" o "Repetidas" para exportar PDF', 2000);
      return;
    }

    if (list.length === 0) {
      showToast(currentView === 'missing' ? '🎉 ¡No tienes cromos faltantes!' : '🎉 ¡No tienes cromos repetidos!', 2000);
      return;
    }

    showToast('📄 Generando PDF...', 1000);

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 15;
      
      const CONTENT_START_Y = 55;
      let yPos = CONTENT_START_Y;
      
      function drawHeader() {
        doc.setFillColor(4, 18, 46);
        doc.rect(0, 0, pageWidth, 42, 'F');
        doc.setDrawColor(245, 197, 66);
        doc.setLineWidth(1);
        doc.line(0, 42, pageWidth, 42);
        
        doc.setTextColor(245, 197, 66);
        doc.setFontSize(18);
        doc.setFont('helvetica', 'bold');
        doc.text('FIFA WORLD CUP 2026', pageWidth / 2, 12, { align: 'center' });
        
        doc.setTextColor(200, 200, 200);
        doc.setFontSize(10);
        doc.text(title, pageWidth / 2, 22, { align: 'center' });
        
        doc.setTextColor(245, 197, 66);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'italic');
        doc.text('SEBASTIAN NAVARRO', pageWidth / 2, 30, { align: 'center' });
        
        doc.setTextColor(150, 150, 150);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'normal');
        doc.text(`Fecha: ${new Date().toLocaleDateString('es-MX')}`, margin, 34);
        doc.text(`Total: ${list.length} cromos`, margin, 38);
      }
      
      drawHeader();
      
      // Agrupar por código
      const grouped = {};
      list.forEach(stickerId => {
        if (stickerId === 'FWC00') {
          if (!grouped['FWC']) grouped['FWC'] = [];
          grouped['FWC'].push('00');
        } else {
          const match = stickerId.match(/^([A-Z]+)(\d+)$/);
          if (match) {
            const code = match[1];
            const number = parseInt(match[2]);
            if (!grouped[code]) grouped[code] = [];
            grouped[code].push(number);
          }
        }
      });
      
      // Ordenar países según SECTIONS
      const sortedCountries = [];
      for (const section of SECTIONS) {
        if (grouped[section.code]) {
          sortedCountries.push(section.code);
        }
      }
      
      // Calcular ancho máximo del código (sin bandera)
      let maxCodeWidth = 0;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      for (const countryCode of sortedCountries) {
        const textWidth = doc.getTextWidth(`${countryCode}:`);
        if (textWidth > maxCodeWidth) {
          maxCodeWidth = textWidth;
        }
      }
      
      const FLAG_WIDTH = 7;
      const COLUMN_WIDTH = maxCodeWidth + FLAG_WIDTH;
      
      for (const countryCode of sortedCountries) {
        let numbers = grouped[countryCode];
        numbers.sort((a, b) => {
          if (a === '00') return -1;
          if (b === '00') return 1;
          return a - b;
        });
        
        if (yPos > pageHeight - 15) {
          doc.addPage();
          yPos = CONTENT_START_Y;
          drawHeader();
        }
        
        // Dibujar bandera o emoji en posición fija
        const flagX = margin;
        const section = SECTIONS.find(s => s.code === countryCode);
        
        if (section && section.useEmoji) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(12);
          doc.text(section.flag, flagX, yPos);
        } else {
          try {
            const flagUrl = `flags/${countryCode}.png`;
            const img = new Image();
            img.crossOrigin = "Anonymous";
            await new Promise((resolve) => {
              img.onload = resolve;
              img.onerror = resolve;
              img.src = flagUrl;
            });
            if (img.complete && img.naturalWidth > 0) {
              doc.addImage(img, 'PNG', flagX, yPos - 3.5, 5.5, 4.5);
            }
          } catch(e) {}
        }
        
        // Código del país con ":" alineado (todos comienzan en la misma posición)
        const codeX = margin + FLAG_WIDTH;
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(9);
        doc.text(`${countryCode}:`, codeX, yPos);
        
        // Números alineados (todos comienzan en COLUMN_WIDTH)
        const numbersStartX = margin + COLUMN_WIDTH + 4.0;
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(8);
        
        let currentX = numbersStartX;
        for (let i = 0; i < numbers.length; i++) {
          const numStr = numbers[i].toString();
          doc.text(numStr, currentX, yPos);
          currentX += doc.getTextWidth(numStr);
  
          if (i < numbers.length - 1) {
            const espacio = 2.5; // Espacio total entre números
            const medioEspacio = espacio / 2.5; // 2.5 para cada lado
    
            currentX += medioEspacio; // Espacio ANTES del guión
    
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(7.5);
            doc.text('–', currentX, yPos);
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(8);
    
            currentX += medioEspacio; // Espacio DESPUÉS del guión
          }
  
          if (currentX > pageWidth - margin) {
            yPos += 4;
            currentX = numbersStartX;
          }
        }
        
        yPos += 9.0;
      }
      
      const fileName = `Panini2026_${currentView === 'missing' ? 'Faltantes' : 'Repetidas'}_${new Date().toISOString().split('T')[0]}.pdf`;
      doc.save(fileName);
      showToast(`✅ PDF generado: ${fileName}`, 2500);
      
    } catch (error) {
      console.error(error);
      showToast('❌ Error al generar PDF: ' + error.message, 3000);
    }
  }

  // ==================== QR INTEROPERABLE ====================
  function generateInteroperableQRData() {
    const duplicatesMap = new Map();
    for (const [sid, qty] of Object.entries(ownedState)) {
      if (qty >= 2) {
        if (sid === 'FWC00') {
          const repeatCount = qty - 1;
          if (!duplicatesMap.has('FWC')) duplicatesMap.set('FWC', []);
          for (let i = 0; i < repeatCount; i++) {
            duplicatesMap.get('FWC').push('00');
          }
        } else {
          const match = sid.match(/^([A-Z]+)(\d+)$/);
          if (match) {
            const code = match[1];
            const number = parseInt(match[2]);
            const repeatCount = qty - 1;
            if (!duplicatesMap.has(code)) duplicatesMap.set(code, []);
            for (let i = 0; i < repeatCount; i++) {
              duplicatesMap.get(code).push(number);
            }
          }
        }
      }
    }
    
    const lines = ['PANINI-REPEATS:v1'];
    for (const [code, numbers] of duplicatesMap.entries()) {
      numbers.sort((a, b) => {
        if (a === '00') return -1;
        if (b === '00') return 1;
        return a - b;
      });
      lines.push(`${code}:${numbers.join(',')}`);
    }
    return lines.join('\n');
  }

  function showQRPage() {
    const qrData = generateInteroperableQRData();
    const duplicateCount = getDuplicateCount();
    document.getElementById('qrDataText').innerHTML = `<strong>📦 ${duplicateCount} stickers repetidos</strong><br><small>Formato compatible con otras apps</small>`;
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById('qrcode'), { text: qrData, width: 200, height: 200 });
    document.getElementById('mainPage').classList.remove('active');
    document.getElementById('qrPage').classList.add('active');
  }

  // ==================== FUNCIONES UI (sin cambios) ====================
  function updateGlobalStats() {
    const ownedCount = getOwnedCount();
    const missingCount = getMissingCount();
    const duplicateCount = getDuplicateCount();
    const percent = TOTAL_STICKERS ? Math.round((ownedCount / TOTAL_STICKERS) * 100) : 0;
    document.getElementById('stat-owned').innerText = ownedCount;
    document.getElementById('stat-missing').innerText = missingCount;
    document.getElementById('stat-total').innerText = TOTAL_STICKERS;
    document.getElementById('stat-percent').innerText = `${percent}%`;
    document.getElementById('stat-duplicates').innerText = duplicateCount;
    document.getElementById('global-progress-fill').style.width = `${percent}%`;
    
    SECTIONS.forEach(sec => {
      let collected = 0;
      for(let i=1; i<=sec.n; i++) if(ownedState[`${sec.code}${i}`] >= 1) collected++;
      if (sec.code === 'FWC' && ownedState['FWC00'] >= 1) collected++;
      const pbFill = document.getElementById(`pb-${sec.code}`);
      const pnSpan = document.getElementById(`pn-${sec.code}`);
      const cardDiv = document.getElementById(`card-${sec.code}`);
      if(pbFill) pbFill.style.width = `${(collected/sec.n)*100}%`;
      if(pnSpan) pnSpan.innerText = `${collected}/${sec.n}`;
      if(cardDiv) {
        cardDiv.classList.toggle('complete', collected === sec.n);
        applyCurrentView(cardDiv, sec, collected);
      }
    });
    
    if (currentSearchTerm !== '') {
      applySearchFilter(currentSearchTerm);
    }
  }
  
  function applyCurrentView(cardDiv, sec, collected) {
    const stickers = cardDiv.querySelectorAll('.sticker');
    stickers.forEach(s => s.style.display = 'flex');
    if (currentView === 'missing') {
      cardDiv.classList.toggle('hidden', collected === sec.n);
      stickers.forEach(s => { 
        const sid = s.getAttribute('data-sticker-id');
        if (ownedState[sid] >= 1) s.style.display = 'none'; 
      });
    } else if (currentView === 'duplicates') {
      let has = false;
      stickers.forEach(s => {
        const sid = s.getAttribute('data-sticker-id');
        if (ownedState[sid] >= 2) { s.style.display = 'flex'; has = true; }
        else s.style.display = 'none';
      });
      cardDiv.classList.toggle('hidden', !has);
    } else {
      cardDiv.classList.remove('hidden');
    }
  }

  function renderFlagsGrid() {
    const container = document.getElementById('flagsGridContainer');
    container.innerHTML = '';
    SECTIONS.forEach(sec => {
      const btn = document.createElement('div');
      btn.className = 'flag-btn-grid';
      btn.innerHTML = `${sec.flag} ${sec.code}`;
      btn.onclick = () => {
        const card = document.getElementById(`card-${sec.code}`);
        if(card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.boxShadow = '0 0 20px rgba(245,197,66,0.6)';
          setTimeout(() => card.style.boxShadow = '', 1500);
        }
      };
      container.appendChild(btn);
    });
  }

  function updateStickerAppearance(el, id) {
    const count = ownedState[id] || 0;
    el.classList.remove('owned', 'duplicate');
    const badge = el.querySelector('.duplicate-badge');
    if(badge) badge.remove();
    if(count === 1) el.classList.add('owned');
    else if(count >= 2) {
      el.classList.add('duplicate');
      const b = document.createElement('div');
      b.className = 'duplicate-badge';
      b.textContent = count - 1;
      el.appendChild(b);
    }
  }

  function handleStickerTouch(sid, e) {
    e.stopPropagation();
    e.preventDefault();
    const now = Date.now();
    if (now - lastTapTime < DOUBLE_TAP_DELAY && lastTapTime !== 0) {
      clearTimeout(tapTimer);
      tapTimer = null;
      lastTapTime = 0;
      if (ownedState[sid] && ownedState[sid] >= 1) showUndoModal(sid);
      else showToast(`${sid} no está marcado`, 1200);
    } else {
      lastTapTime = now;
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        const count = ownedState[sid] || 0;
        if (count === 0) { ownedState[sid] = 1; showToast(`+ ${sid} obtenido`, 1200); }
        else if (count === 1) { ownedState[sid] = 2; showToast(`🔄 ${sid} repetida`, 1200); }
        else { ownedState[sid] = count + 1; showToast(`🔄 ${sid} repetida x${count}`, 1200); }
        persist();
        updateStickerUI(sid);
        updateGlobalStats();
        tapTimer = null;
        lastTapTime = 0;
      }, DOUBLE_TAP_DELAY);
    }
  }

  function updateStickerUI(stickerId) {
    const el = document.querySelector(`.sticker[data-sticker-id="${stickerId}"]`);
    if(el) {
      updateStickerAppearance(el, stickerId);
      el.classList.add('sticker-pop');
      setTimeout(() => el.classList.remove('sticker-pop'), 200);
      const card = el.closest('.team-card');
      if(card) {
        const sec = SECTIONS.find(s => s.code === card.id.replace('card-', ''));
        if(sec) {
          let c = 0;
          for(let i=1; i<=sec.n; i++) if(ownedState[`${sec.code}${i}`] >= 1) c++;
          if (sec.code === 'FWC' && ownedState['FWC00'] >= 1) c++;
          applyCurrentView(card, sec, c);
        }
      }
    }
  }

  function showUndoModal(stickerId) {
    if (tapTimer) clearTimeout(tapTimer);
    lastTapTime = 0;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const dialog = document.createElement('div');
    dialog.className = 'modal-dialog';
    const count = ownedState[stickerId] || 0;
    dialog.innerHTML = `<p>¿Deseas deshacer ${stickerId}?<br>${count > 1 ? `(Repetida x${count-1})` : '(Marcada)'}</p><div class="modal-buttons"><button class="btn-undo">↩️ Deshacer</button><button class="btn-close">✖️ Cerrar</button></div>`;
    dialog.querySelector('.btn-undo').onclick = () => {
      const c = ownedState[stickerId] || 0;
      if(c === 1) delete ownedState[stickerId];
      else if(c > 1) ownedState[stickerId] = c - 1;
      persist();
      updateStickerUI(stickerId);
      updateGlobalStats();
      showToast(`${stickerId} deshecho un paso`, 1200);
      document.body.removeChild(overlay);
    };
    dialog.querySelector('.btn-close').onclick = () => document.body.removeChild(overlay);
    overlay.onclick = (e) => { if(e.target === overlay) document.body.removeChild(overlay); };
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
  }

  function renderAll() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';
    SECTIONS.forEach(sec => {
      const card = document.createElement('div');
      card.className = 'team-card';
      card.id = `card-${sec.code}`;
      card.dataset.code = sec.code.toLowerCase();
      card.dataset.name = sec.name.toLowerCase();
      
      const header = document.createElement('div');
      header.className = 'team-header';
      header.innerHTML = `<span class="team-flag">${sec.flag}</span><span class="team-code">${sec.code}</span><span class="team-name">${sec.name}</span><div class="team-stats"><span id="pn-${sec.code}" style="font-weight:600;">0/${sec.n}</span><div class="team-progress-bar"><div class="team-progress-fill" id="pb-${sec.code}" style="width:0%"></div></div><span class="complete-tag">✓ COMPLETO</span></div>`;
      card.appendChild(header);
      
      const grid = document.createElement('div');
      grid.className = 'sticker-grid';
      
      if (sec.code === 'FWC') {
        const sid = 'FWC00';
        const el = document.createElement('div');
        el.className = 'sticker';
        el.textContent = sid;
        el.setAttribute('data-sticker-id', sid);
        updateStickerAppearance(el, sid);
        el.onclick = (e) => handleStickerTouch(sid, e);
        grid.appendChild(el);
      }
      
      for(let i=1; i<=sec.n; i++) {
        const sid = `${sec.code}${i}`;
        const el = document.createElement('div');
        el.className = 'sticker';
        el.textContent = sid;
        el.setAttribute('data-sticker-id', sid);
        updateStickerAppearance(el, sid);
        el.onclick = (e) => handleStickerTouch(sid, e);
        grid.appendChild(el);
      }
      
      const scrollBtn = document.createElement('button');
      scrollBtn.className = 'scroll-top-btn';
      scrollBtn.textContent = '⬆️ Subir';
      scrollBtn.onclick = () => document.getElementById('topPage').scrollIntoView({ behavior: 'smooth' });
      grid.appendChild(scrollBtn);
      card.appendChild(grid);
      container.appendChild(card);
    });
    renderFlagsGrid();
    updateGlobalStats();
  }

  function applySearchFilter(q) {
    q = q.toLowerCase().trim();
    let firstVisible = null;
    document.querySelectorAll('.team-card').forEach(card => {
      const match = card.dataset.code.includes(q) || card.dataset.name.includes(q);
      if (q !== "" && !match) {
        card.classList.add('hidden');
      } else if (q !== "" && match) {
        card.classList.remove('hidden');
        if (!firstVisible) firstVisible = card;
      } else {
        card.classList.remove('hidden');
      }
    });
    return firstVisible;
  }

  function filterTeams() {
    currentSearchTerm = document.getElementById('searchTeam').value;
    const firstVisible = applySearchFilter(currentSearchTerm);
    if (firstVisible && currentSearchTerm !== "") {
      setTimeout(() => {
        firstVisible.scrollIntoView({ behavior: 'smooth', block: 'center' });
        firstVisible.style.boxShadow = '0 0 20px rgba(245,197,66,0.6)';
        setTimeout(() => firstVisible.style.boxShadow = '', 1500);
      }, 100);
    }
  }

  let toastTimeout;
  function showToast(msg, duration = 1800) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
  }

  function setView(view) {
    currentView = view;
    document.getElementById('albumBtn').classList.toggle('active-view', view === 'album');
    document.getElementById('missingBtn').classList.toggle('active-view', view === 'missing');
    document.getElementById('duplicatesBtn').classList.toggle('active-view', view === 'duplicates');
    
    const pdfBar = document.getElementById('pdfBar');
    if (view === 'missing' || view === 'duplicates') {
      pdfBar.classList.add('visible');
    } else {
      pdfBar.classList.remove('visible');
    }
    
    updateGlobalStats();
    showToast(view === 'album' ? '📒 Vista Álbum' : view === 'missing' ? '🔍 Mostrando faltantes' : '🔄 Mostrando repetidas', 1500);
  }

  function backToAlbum() {
    document.getElementById('qrPage').classList.remove('active');
    document.getElementById('mainPage').classList.add('active');
  }

  // Event Listeners
  document.getElementById('albumBtn').onclick = () => setView('album');
  document.getElementById('missingBtn').onclick = () => setView('missing');
  document.getElementById('duplicatesBtn').onclick = () => setView('duplicates');
  document.getElementById('qrBtn').onclick = showQRPage;
  document.getElementById('backToAlbumBtn').onclick = backToAlbum;
  document.getElementById('pdfBtn').onclick = generatePDF;
  document.getElementById('searchTeam').addEventListener('input', filterTeams);
  document.getElementById('searchTeam').addEventListener('change', filterTeams);

  renderAll();
</script>
</body>
</html>
